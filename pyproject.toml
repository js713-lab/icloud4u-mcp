[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-docs-mcp"
version = "0.1.0"
description = "Read-only MCP server for listing, searching, downloading, and reading iCloud Drive documents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "js713-lab" }]
keywords = ["mcp", "icloud", "icloud-drive", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: File Sharing",
]
dependencies = [
    "mcp>=1.9,<3",
    "pyicloud>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/js713-lab/icloud4u-mcp"
Repository = "https://github.com/js713-lab/icloud4u-mcp"
Issues = "https://github.com/js713-lab/icloud4u-mcp/issues"
Changelog = "https://github.com/js713-lab/icloud4u-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
icloud-docs-mcp = "icloud_docs_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
